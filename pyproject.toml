[project]
name = "cart-segmentation-training"
version = "0.1.0"
description = "RF-DETR segmentation training for the three industrial cart classes"
readme = "README.md"
requires-python = ">=3.13.11"
dependencies = [
    "duckdb>=1.5.4",
    "huggingface-hub>=1.24.0",
    "numpy>=2.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.0.0",
    # Les extras portent les piles d'entrainement et d'export : pycocotools,
    # scipy, pytorch_lightning, torchmetrics et faster-coco-eval sont derriere
    # `train`, onnx / onnxsim / onnx_graphsurgeon derriere `onnx`. Un `rfdetr`
    # nu s'importe puis echoue a la premiere epoch et dans masks_to_coco.
    "rfdetr[train,onnx]==1.9.4",
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
]

# Le GPU est une RTX PRO 6000 Blackwell, capacite de calcul 12.0 (sm_120).
# Seules les compilations CUDA 13.0 embarquent les noyaux sm_120 : le wheel
# generique de PyPI s'installe, s'importe, annonce `cuda.is_available() == True`,
# puis leve "no kernel image is available" au premier tenseur pose sur la carte.
# Les versions epinglees ci-dessus sont la paire verifiee sur ce GPU.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

# La chaine ne tourne que sur la machine d'entrainement Linux x86_64 ; resoudre
# pour d'autres plateformes echouerait, les compilations cu130 n'existant que
# pour linux et windows.
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
