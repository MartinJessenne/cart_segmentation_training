[project]
name = "cart-segmentation-training"
version = "0.1.0"
description = "Industrial Cart Segmentation Training with RF-DETR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "duckdb>=1.5.5",
    "huggingface-hub>=1.29.0",
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "rfdetr[augment,onnx,train]==1.9.4",
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "tqdm>=4.65.0",
    "wandb>=0.18.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
