[project]
name = "cart-segmentation-training"
version = "0.1.0"
description = "Cart segmentation training: YOLO and RF-DETR"
readme = "README.md"
requires-python = ">=3.13.11"
dependencies = [
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "duckdb>=1.5.5",
    "huggingface-hub>=1.29.0",
    "jupyter>=1.1.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "parquet>=1.3.1",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "rfdetr[onnx,train]==1.9.4",
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "tqdm>=4.70.0",
    "ultralytics>=8.4.138",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
